name: barter_app
description: BARTER — Stitch UI in Flutter (web, iOS, Android).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  material_symbols_icons: ^4.2794.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/barter_logo.png
