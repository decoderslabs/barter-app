<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BARTER — editorial exchange">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#b3193d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BARTER">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>BARTER</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  <style>
    body { margin: 0; background: #ffffff; }
  </style>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-install-ready'));
    });
    window.triggerPwaInstall = async function() {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        const choice = await window.deferredPwaPrompt.userChoice;
        window.deferredPwaPrompt = null;
        return choice && choice.outcome === 'accepted';
      }
      return false;
    };
    window.isPwaInstalled = function() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };

    // OneSignal & Push Notifications Bridge
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.initOneSignal = function(appId) {
      if (!appId) return;
      window.OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: appId,
          notifyButton: { enable: false },
          allowLocalhostAsSecureOrigin: true,
        });
      });
    };

    window.requestNotificationPermission = async function() {
      try {
        if (window.OneSignalDeferred) {
          return new Promise((resolve) => {
            window.OneSignalDeferred.push(async function(OneSignal) {
              await OneSignal.Notifications.requestPermission();
              const subId = OneSignal.User.PushSubscription.id;
              resolve(subId || '');
            });
          });
        } else if ('Notification' in window) {
          const perm = await Notification.requestPermission();
          return perm === 'granted';
        }
      } catch (e) {
        console.error('Error requesting notification permission:', e);
      }
      return '';
    };

    window.getOneSignalPlayerId = async function() {
      try {
        return new Promise((resolve) => {
          window.OneSignalDeferred.push(async function(OneSignal) {
            resolve(OneSignal.User.PushSubscription.id || '');
          });
        });
      } catch (e) {
        return '';
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
